name: mir-ci
base: ubuntu@26.04

# `mir-ci` runs inside an Ubuntu container.
#
# - The `uv` SDK manages the Python interpreter and the test harness. Some
#   runtime `--deps` (e.g. `rpaframework`) require Python <3.14, so the harness
#   runs against a uv-managed Python 3.12 rather than the 3.14 in Ubuntu 26.04.
# - The `project-deps` SDK installs the system packages the build and tests need
#   and pre-seeds the server/application snaps into the base image.
sdks:
  - name: uv
  - name: project-mir-ci

actions:
  # Install the dependencies (snaps, debs, pip packages) needed by the tests.
  # Forward any pytest selector, e.g. `workshop run mir-ci -- deps -k ubuntu_frame`.
  # Given no arguments it installs the dependencies for all tests.
  deps: |
    cd mir-ci/mir_ci
    uv run pytest --deps "$@"

  # List the available tests without running them, e.g.
  # `workshop run mir-ci -- list -m smoke`.
  list: |
    cd mir-ci/mir_ci
    uv run pytest --collect-only -q "$@"

  # Run the integration tests inside a virtual server.
  # Forward any pytest argument, e.g. `workshop run mir-ci -- test -k ubuntu_frame`.
  test: |
    cd ~/mir_ci
    xvfb-run -a uv run pytest --basetemp ~/pytest-temp "$@" || RET=$?
    cd ~/pytest-temp && tree -H '.' -P 'report.html' --prune -o index.html
    echo "Pytest report available at http://$( hostname -f ):8001" >&2
    exit $RET

  see: |
    if [ -z "$DISPLAY" ]; then
      echo "Connect the 'desktop' interface first" >&2
      exit 1
    fi
    cd ~/mir_ci
    uv run pytest --basetemp ~/pytest-temp "$@" || RET=$?
    cd ~/pytest-temp && tree -H '.' -P 'report.html' --prune -o index.html
    echo "Pytest report available at http://$( hostname -f ):8001" >&2
    exit $RET

  # Run the test suite's own self tests.
  self-test: |
    cd ~/mir_ci
    xvfb-run -a uv run pytest --basetemp ~/pytest-temp -m self "$@" || RET=$?
    cd ~/pytest-temp && tree -H '.' -P 'report.html' --prune -o index.html
    echo "Pytest report available at http://$( hostname -f ):8001" >&2
    exit $RET

  # Run the static analysis checks (pre-commit).
  lint: |
    cd mir-ci
    pre-commit run --all-files "$@"
